[package]
name = "oidc-caep-risc"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["rcbjBlueMars <9321971+rcbjBlueMars@users.noreply.github.com>"]
description = "Confidential OpenID Connect relying party and one CAEP/RISC poll stream"
repository = "https://github.com/rcbj/oidc-caep-risc-rust"
homepage = "https://github.com/rcbj/oidc-caep-risc-rust"
documentation = "https://docs.rs/oidc-caep-risc"
readme = "README.md"
keywords = ["oidc", "openid", "oauth2", "caep", "risc"]
categories = ["authentication"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
hmac = "0.13"
native-tls = "0.2"
p256 = { version = "0.14", features = ["ecdsa", "pem", "getrandom"] }
p384 = { version = "0.14", features = ["ecdsa"] }
p521 = { version = "0.14", features = ["ecdsa"] }
rand = "0.8"
rsa = { version = "0.9", features = ["pem", "sha2"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
signature = "2"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls", "native-tls"] }
url = "2"

[[bin]]
name = "demo"
path = "demo/main.rs"
